name: Coral
description: 'Coral is the Solana developer platform company (originally Coral / coral-xyz)
  behind Anchor, the most widely used framework for writing Solana Sealevel smart-contract
  programs. Anchor provides a Rust eDSL, an IDL/codegen toolchain, TypeScript and Rust
  clients, the anchor CLI (via the Anchor Version Manager, avm), and testing tooling
  that abstract away Solana program boilerplate. Coral also built Backpack, an application-first
  crypto wallet for executable NFTs (xNFTs). The company raised a $20M strategic round
  led by FTX Ventures and Jump Crypto with participation from Multicoin Capital. This
  is a developer-framework / smart-contract-tooling provider rather than a REST/HTTP API
  provider, so REST-oriented artifacts (OpenAPI, OAuth scopes, webhooks) are not applicable;
  its developer surface is packages, a CLI, and framework documentation.'
